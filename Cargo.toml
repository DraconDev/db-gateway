[workspace]
members = ["."]
resolver = "3"

[package]
name = "dg"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.23.1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4.3"
libc = "0.2"
rand = "0.10.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled", "extra_check", "hooks", "limits", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

[profile.test]
debug = 0

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
tower = { version = "0.5", features = ["util"] }
