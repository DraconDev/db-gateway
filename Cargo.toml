[workspace]
members = [".", "crates/dg-client"]
resolver = "3"

[package]
name = "dg"
version = "0.10.0"
edition = "2024"
publish = false
description = "A single-owner SQLite service: one gateway, many isolated databases, scoped credentials, an HTTP API, CLI and TUI, and off-host backups."
repository = "https://github.com/DraconDev/db-gateway"
readme = "README.md"
# The LICENSE file is the GNU AGPL v3 text, with no "or later" notice
# anywhere in the repository, so the grant is version 3 itself. If the
# intent is "v3 or any later version", that has to be said explicitly in
# the license notice rather than assumed -- see docs/publication-readiness.md.
license = "AGPL-3.0-only"

[dependencies]
axum = "0.8"
base64 = "0.23.1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4.3"
libc = "0.2"
rand = "0.10.2"
ratatui = "0.30"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.41", features = ["bundled", "extra_check", "hooks", "limits", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
unicode-width = "0.2"

[profile.test]
debug = 0

[dev-dependencies]
dg-client = { path = "crates/dg-client" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
tower = { version = "0.5", features = ["util"] }
