[package]
name = "dg-client"
version = "0.4.1"
edition = "2024"
publish = false
description = "Typed Rust client for the DB Gateway JSON API (mirrors client/ TypeScript semantics)"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
