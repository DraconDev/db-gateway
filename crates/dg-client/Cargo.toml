[package]
name = "dg-client"
version = "0.10.0"
edition = "2024"
publish = false
description = "Typed Rust client for the DB Gateway JSON API (mirrors client/ TypeScript semantics)"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["sync", "rt"], optional = true }

[features]
# Shadow mode (src/shadow.rs): mirror a live application's writes to dg in
# the background. Off by default, so the plain client needs no runtime.
shadow = ["dep:tokio"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
