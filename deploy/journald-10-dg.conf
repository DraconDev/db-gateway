# journald retention sized for the 1 GB host (audit A8) — template.
#
# Install as /etc/systemd/journald.conf.d/10-dg.conf on the target
# host, then `systemctl restart systemd-journald`. Nothing in this
# repository installs it.
#
# Why: dg* units report through the journal (digest LogSink, dg-alert
# lines, producer attempts), and that evidence was already lost once
# to default vacuuming (docs/watchdog-2026-10-17.log). journald
# retention is global, not per-unit — this drop-in sizes the whole
# journal so dg evidence survives, it cannot ring-fence dg units
# alone; the values are sized so the journal stays a small, bounded
# tenant of the 1 GB host instead of an unbounded one:
#   - first live sample (2026-10-19): journal 24 MB total.
#   - SystemMaxUse=128M caps the journal at ~5x that, roughly 2% of
#     the 25 GB disk, while SystemKeepFree=2G always leaves room for
#     the data dir + backup sets to grow into.
#   - MaxRetentionSec=14day bounds dg evidence to a fortnight even
#     when the size cap is not reached — long enough to cover the
#     weekly restore-drill cycle and a 7-day soak, short enough that
#     a postmortem never starts from a vacuumed journal.
# Per-unit rate limits live in the units themselves
# (LogRateLimitIntervalSec/LogRateLimitBurst are [Service] keys);
# the dg units' structured output is low-rate by construction, so
# no per-unit limit is set — raising one is a unit change, not a
# journald change.

[Journal]
SystemMaxUse=128M
SystemKeepFree=2G
MaxRetentionSec=14day
