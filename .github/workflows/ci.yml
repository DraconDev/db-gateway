name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    # The hard backstop, and it has to cover the whole job: the suite
    # budget below (1500s) plus the steps that follow it — the release
    # build, the container engine and the pinned builder image, the
    # TypeScript suite (which builds the Rust binary itself), and the
    # deploy/host gates. At 30 minutes the backstop landed INSIDE the
    # budget's own headroom, so a suite that ran over its budget was
    # cancelled instead of warned about — the opposite of what the
    # budget exists to say.
    timeout-minutes: 45
    steps:
      # Third-party actions are pinned to full commit SHAs, matching the
      # rustsec/audit-check gate below, so a moved tag cannot change what
      # this job runs. The compiler version itself is pinned in
      # rust-toolchain.toml (1.97.1), not by the action ref.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Compilation is a separate, untimed step so the timed step below
      # measures test-binary execution only -- the number the suite-time
      # budget governs (test binaries spawn processes and sleep on real
      # timers, so their runtime grows with behaviour, not with code size).
      - name: Compile Rust tests
        run: cargo test --workspace --locked --no-run
      # Suite-time budget (A15 in docs/audit-2026-10-19.md): measured
      # 655s on the maintainer's dev box on 2026-10-23, for 395 tests
      # across 75 binaries (it was 261s for 218 tests on 2026-10-19 --
      # the suite roughly doubled in size, and the budget is a DURATION,
      # not a test count: the suite grows every time a behaviour gets its
      # own test, and pinning the count here would make the budget a
      # statement about the past).
      # Budget is 1500s, ~2.3x that measurement, so the warning fires on
      # real growth rather than runner noise. Over-budget warns instead
      # of failing: a slow suite is a triage signal, and the job's
      # timeout is the hard backstop. When the warning fires,
      # profile the slowest test binaries (`cargo test -- --format
      # terse` timings, or --test-threads=1) and either fix the slow
      # test or raise the budget here AND in the A15 record with a new
      # measurement -- never raise it just to silence the warning.
      - name: Run Rust test suite (timed)
        env:
          RUST_SUITE_BUDGET_SECONDS: "1500"
        run: |
          start=$SECONDS
          status=0
          cargo test --workspace --locked || status=$?
          elapsed=$((SECONDS - start))
          echo "Rust suite execution: ${elapsed}s (budget: ${RUST_SUITE_BUDGET_SECONDS}s)"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if [ "$elapsed" -gt "$RUST_SUITE_BUDGET_SECONDS" ]; then
            echo "::warning::Rust suite execution took ${elapsed}s, over the ${RUST_SUITE_BUDGET_SECONDS}s budget (A15). Profile the slowest tests before raising the budget."
          fi
      - run: cargo build --release --locked
      # The release-bundle contract test exercises the pinned micro2 builder
      # in a real container, so the test's contract depends on a working
      # docker/podman. ubuntu-latest does not ship one, and adding the engine
      # inside a `services:` block requires Docker-in-Docker, which is more
      # than a single test needs. Install docker.io, start the daemon, and
      # run only that one test so the rest of cargo test does not pay the
      # build-time penalty of building inside a fresh container.
      - name: Provision a container engine for the release-bundle test
        # Probe docker first (release-bundle.sh's preferred engine), then
        # podman; install whichever is missing so the step is a no-op on
        # runners that already ship one. `service docker start` is a no-op
        # when the engine is already up, so it is safe to run after a
        # successful `docker info`. If neither engine answers, the step
        # exits non-zero with a message that names the package each engine
        # ships in, so the failure points at the install action rather
        # than at the test that follows.
        run: |
          set -euo pipefail
          if command -v docker >/dev/null 2>&1 && sudo docker info >/dev/null 2>&1; then
            echo "release-bundle: using docker"
          elif command -v podman >/dev/null 2>&1 && podman info >/dev/null 2>&1; then
            echo "release-bundle: using podman"
          else
            sudo apt-get update -qq
            if ! command -v docker >/dev/null 2>&1 || ! sudo docker info >/dev/null 2>&1; then
              sudo apt-get install -y -qq docker.io
              sudo service docker start || true
              if ! sudo docker info >/dev/null 2>&1; then
                echo "::error::release-bundle: neither docker nor podman is available on this runner." >&2
                echo "::error::install one of: docker.io (apt) or podman (apt)." >&2
                exit 1
              fi
            fi
            if ! command -v podman >/dev/null 2>&1; then
              echo "release-bundle: podman not present, docker is sufficient for this test"
            fi
            echo "release-bundle: docker provisioned"
          fi
      - name: Run the pinned micro2 release-bundle test
        run: cargo test --workspace --locked --test release_bundle -- --ignored
        # The contract test (`micro2_pinned_container_builds_bundle_and_records_builder`)
        # is `#[ignore]`d so `cargo test --workspace` does not pay the cost on every
        # PR; the explicit `--ignored` here re-runs only it once the previous
        # step has confirmed a working container engine. The four sibling
        # tests in this file still run as part of the standard
        # `cargo test --workspace` step above -- the three fake-engine
        # modes (no engine, builder inspection fail, build/smoke fail)
        # protect the script's failure modes without needing a real
        # container, and `explicit_host_bundle_never_claims_micro2_abi_verified`
        # pins the DG_RELEASE_TARGET=host guarantee that no container
        # engine would otherwise catch.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      # Credential-shape gate over the tracked tree (A1). A commit that
      # carries an AWS key, a GitHub token, a private key block, or a
      # long literal assigned to a secret-ish name fails here, with the
      # file and line but never the value. The repo is pushed to GitHub
      # and GitLab and holds the OVH/Litestream/owner-key material that
      # must never be committed, so this is the gate that keeps that
      # property true without depending on anyone's memory.
      - run: ./scripts/secret-scan.sh
      - run: npm ci --prefix client
      # Vulnerability gate for the client dependency tree. --audit-level
      # high means moderate/low findings in dev-only tooling (typescript)
      # do not block, but a high or critical advisory fails the job the
      # day it is published. Currently clean (0 vulnerabilities).
      - run: npm audit --prefix client --audit-level=high
      - run: npm test --prefix client
      # `systemd-analyze verify` is half the deploy-template gate; the other
      # half (placeholder substitution, MemoryMax, etc.) is in the script
      # itself. ubuntu-latest does not ship systemd-analyze by default, so
      # install it here so the script can run its full check; without this
      # the script logs a 'systemd-analyze not available; skipped' line and
      # the gate prints OK on a partial verification.
      - name: Install systemd-analyze for the deploy-template gate
        run: sudo apt-get update -qq && sudo apt-get install -y -qq systemd
      - run: ./scripts/validate-deploy.sh
      # The host-audit repo-side pass needs no host: it reads git HEAD and (if
      # DG_RELEASE_BUNDLE_DIR is nominated) a bundle, and exits 0 when every
      # repo-side invariant holds. Live runs set DG_AUDIT_TARGET and are done
      # by an operator, never in CI. This gate catches a broken probe body or
      # a scraping regression at the same place the deploy-template gate runs.
      - run: ./scripts/host-audit.sh
      # Orphan/residue gate: a `dg serve` that outlived its launcher, or a
      # scratch directory a run failed to remove, fails here. On a fresh CI
      # runner this is a smoke check of the probe; its real job is on a
      # developer or agent box, where six leaked servers and 277 MB of /tmp
      # residue once went unnoticed for days. `dg serve` also arms
      # PR_SET_PDEATHSIG so the class is fixed at the source, and
      # tests/orphan_guard.rs pins both halves. DG_ORPHAN_MIN_AGE_SECS=0 means
      # any orphan counts, including one this very job started.
      - name: Check for orphaned servers and temp residue
        env:
          DG_ORPHAN_MIN_AGE_SECS: "0"
        run: ./scripts/check-orphans.sh
      - run: python3 scripts/check_plan_consistency.py docs/personal-turso-megaplan.md
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  deny:
    # cargo-deny enforces deny.toml: advisories, duplicate/wildcard bans,
    # the permissive-license allowlist, and crates.io-only sources for the
    # locked dependency tree. The RustSec job above watches advisories on
    # a schedule-friendly action; this job is the one that also stops a
    # newly-added dependency under a non-allowlisted license from merging
    # quietly. Run it locally before pushing dependency changes:
    # `cargo deny check`.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # The action's default `arguments` is --all-features, which
          # would evaluate a different feature graph than the locked
          # tree `cargo deny check` verifies locally, so it is emptied.
          # cargo-deny has no --locked flag (it errors on one): it
          # resolves the graph from the tracked Cargo.lock, which is
          # exactly the tree to gate. Verify with the same spelling the
          # action runs: cargo-deny --log-level warn \
          #   --manifest-path ./Cargo.toml check
          arguments: ""
