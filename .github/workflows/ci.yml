name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned to full commit SHAs, matching the
      # rustsec/audit-check gate below, so a moved tag cannot change what
      # this job runs. The compiler version itself is pinned in
      # rust-toolchain.toml (1.97.1), not by the action ref.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - run: npm test --prefix client
      - run: npm ci --prefix web
      # Pin the browser suite to Playwright's own chromium instead of the
      # runner-imaged system Chrome, whose major version drifts
      # independently of the playwright dependency and breaks launch
      # pairing. The fixture honors PLAYWRIGHT_BROWSER_EXECUTABLE first.
      - run: npx playwright install chromium --with-deps
        working-directory: web
      - run: echo "PLAYWRIGHT_BROWSER_EXECUTABLE=$(node -e "const {chromium}=require('playwright'); console.log(chromium.executablePath())")" >> $GITHUB_ENV
        working-directory: web
      - run: npm test --prefix web
      # The two browser gates live under web/ so their bare `playwright`
      # import resolves against web/node_modules, the package that declares
      # it. Running them from the repo-root scripts/ dir walks the lookup
      # past the repo and only succeeds against a machine-global module dir.
      - run: node web/scripts/web-console-security-check.mjs
      - run: node web/scripts/web-console-smoke.mjs
      - run: node scripts/dg-web-smoke.mjs
      - run: ./scripts/validate-deploy.sh
      - run: python3 scripts/check_plan_consistency.py docs/personal-turso-megaplan.md
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
